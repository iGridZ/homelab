name: CI

on:
  push:
    branches: [main, dev, "feature/**"]
  pull_request:
    branches: [main, dev]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  shellcheck:
    name: shellcheck
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Lint shell scripts
        run: |
          mapfile -t files < <(git ls-files '*.sh')
          if [ "${#files[@]}" -eq 0 ]; then echo "No shell scripts"; exit 0; fi
          shellcheck --severity=warning "${files[@]}"

  yamllint:
    name: yamllint
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install yamllint
        run: pip install --user yamllint==1.35.1
      - name: Lint YAML
        run: yamllint --strict .

  compose:
    name: compose validation
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Validate every stack
        run: |
          shopt -s nullglob
          stacks=(stacks/*/compose.yaml)
          if [ "${#stacks[@]}" -eq 0 ]; then echo "No stacks yet"; exit 0; fi
          # external networks are created up front so `config` can resolve them
          docker network create media >/dev/null 2>&1 || true
          for f in "${stacks[@]}"; do
            dir=$(dirname "$f")
            echo "::group::$dir"
            # use placeholder values from .env.example, never real secrets
            if [ -f "$dir/.env.example" ]; then cp "$dir/.env.example" "$dir/.env"; fi
            docker compose -f "$f" --project-directory "$dir" config --quiet
            echo "::endgroup::"
          done

  gitleaks:
    name: secret scan
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # scan the full history, not just the last commit
      - name: Run gitleaks
        run: |
          docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:v8.21.2 \
            detect --source /repo --redact --verbose
