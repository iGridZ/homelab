# Camera stack: go2rtc (streaming + viewer), vivosun-fetcher (camera credentials)
# CLI equivalent: run.sh (keep both in sync)
name: camera

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  go2rtc:
    image: alexxit/go2rtc:1.9.15
    container_name: go2rtc
    restart: unless-stopped
    # was privileged: true - not needed, the config only relays RTSP (no ffmpeg/exec)
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    environment:
      TZ: Europe/Berlin
    ports:
      - "8555:8555/tcp"        # WebRTC for the public viewer (router forward)
    volumes:
      - /docker/config/go2rtc:/config
    networks:
      - media
    logging: *logging

  vivosun-fetcher:
    image: ghcr.io/igridz/vivosun-fetcher:latest   # own image, built by its repo's CI
    container_name: vivosun-fetcher
    restart: unless-stopped
    depends_on:
      - go2rtc
    env_file: .env
    environment:
      TZ: Europe/Berlin
      # only go2rtc gets the camera credentials
      GO2RTC_API_URL: http://go2rtc:1984
      STREAM_NAME: rtsp-cam
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    networks:
      - media
    logging: *logging

networks:
  media:
    external: true
