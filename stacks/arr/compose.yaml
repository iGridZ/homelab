# Media automation: Sonarr (series), Radarr (movies), SABnzbd (downloads)
# CLI equivalent: run.sh (keep both in sync)
name: arr

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

x-common: &common
  restart: unless-stopped
  networks:
    - media
  security_opt:
    - no-new-privileges:true
  logging: *logging

# No published ports: NPM reaches all three by container name on the "media"
# network, and Sonarr/Radarr reach SABnzbd as http://sabnzbd:8080.
services:
  sonarr:
    <<: *common
    image: ghcr.io/hotio/sonarr:release-4.0.20.3014
    container_name: sonarr
    environment:
      TZ: Europe/Berlin
      PUID: "1000"
      PGID: "1000"
      UMASK: "002"
    volumes:
      - /docker/configs/sonarr:/config
      - /media/share:/data
      - /home/rock/downloads:/downloads

  radarr:
    <<: *common
    image: ghcr.io/hotio/radarr:release-6.4.4.10685
    container_name: radarr
    environment:
      TZ: Europe/Berlin
      PUID: "1000"
      PGID: "1000"
      UMASK: "002"
    volumes:
      - /docker/configs/radarr:/config
      - /media/share:/data
      - /home/rock/downloads:/downloads

  sabnzbd:
    <<: *common
    image: lscr.io/linuxserver/sabnzbd:5.1.3
    container_name: sabnzbd
    environment:
      TZ: Europe/Berlin
      PUID: "1000"
      PGID: "1000"
    volumes:
      - /docker/configs/sabnzbd:/config
      - /home/rock/downloads:/downloads
      - /home/rock/incomplete/downloads:/incomplete-downloads
      - /media/share/download:/software

networks:
  media:
    external: true
